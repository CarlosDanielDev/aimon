[package]
name = "aimon"
version = "0.4.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Tiny TUI that watches what terminal coding agents spawn and kills orphaned workers before macOS runs out of memory"
repository = "https://github.com/CarlosDanielDev/aimon"

[dependencies]
ratatui = "0.30"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[target.'cfg(target_os = "macos")'.dependencies]
sysctl = "0.7"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
panic = "deny"
unimplemented = "deny"
too_many_lines = "deny"
