<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="aimon mascot: a capsule guard zaps an orphan process before memory pressure goes critical">
  <!-- Vector master of assets/gen_mascot.py. 3s loop: the belly gauge climbs while the orphan
       ghost feeds; the guard zaps it, pressure drops, the ghost respawns. -->
  <style>
    .ghost { animation: ghost 3s linear infinite; }
    .bob { animation: bob 1.5s ease-in-out infinite alternate; }
    .xeyes { opacity: 0; animation: xeyes 3s linear infinite; }
    .bolt { opacity: 0; animation: bolt 3s linear infinite; }
    .poof { opacity: 0; transform-box: fill-box; transform-origin: center;
            animation: poof 3s linear infinite; }
    .pupils { animation: look 6s linear infinite; }
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 3s linear infinite; }
    .gauge { animation: gauge 3s linear infinite; }
    .tip { animation: tip 3s linear infinite; }
    @keyframes ghost { 0%,66% {opacity:1} 78%,90% {opacity:0} 100% {opacity:1} }
    @keyframes bob { from {transform:translateY(-5px)} to {transform:translateY(5px)} }
    @keyframes xeyes { 0%,66% {opacity:0} 68%,76% {opacity:1} 78%,100% {opacity:0} }
    @keyframes bolt { 0%,66% {opacity:0} 68%,78% {opacity:1} 80%,100% {opacity:0} }
    @keyframes poof { 0%,76% {opacity:0; transform:scale(.5)} 80% {opacity:1; transform:scale(1)}
                      92%,100% {opacity:0; transform:scale(1.25)} }
    @keyframes look { 0%,100% {transform:translateX(0)} 25% {transform:translateX(-4px)}
                      55%,75% {transform:translateX(6px)} }
    @keyframes blink { 0%,42%,50%,100% {transform:scaleY(1)} 46% {transform:scaleY(.08)} }
    @keyframes gauge { 0% {width:12px; fill:#39ff14} 40% {width:56px; fill:#39ff14}
                       55% {width:84px; fill:#ffb000} 66%,68% {width:112px; fill:#ff3860}
                       85%,100% {width:12px; fill:#39ff14} }
    @keyframes tip { 0%,66% {fill:#00e5ff} 68%,78% {fill:#ff2e97} 80%,100% {fill:#00e5ff} }
  </style>

  <rect width="512" height="512" rx="96" fill="#0b0e1a"/>

  <!-- orphan ghost -->
  <g class="ghost"><g class="bob">
    <path d="M384 138a26 26 0 0 1 52 0v16l-6.5 -8 -6.5 8 -6.5 -8 -6.5 8 -6.5 -8 -6.5 8 -6.5 -8 -6.5 8z" fill="#ffb000"/>
    <circle cx="400" cy="132" r="4" fill="#0b0e1a"/>
    <circle cx="420" cy="132" r="4" fill="#0b0e1a"/>
  </g></g>
  <g class="xeyes" fill="none" stroke="#ff3860" stroke-width="4" stroke-linecap="round">
    <path d="M396 124l8 8M404 124l-8 8M416 124l8 8M424 124l-8 8"/>
  </g>
  <g class="poof">
    <circle cx="410" cy="138" r="30" fill="none" stroke="#8a98c4" stroke-width="3"/>
    <path d="M396 124l28 28M424 124l-28 28" stroke="#ff3860" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- bolt: antenna -> ghost -->
  <path class="bolt" d="M256 108L310 122L362 114L410 150" fill="none"
        stroke="#ff2e97" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- antenna -->
  <line x1="256" y1="152" x2="256" y2="108" stroke="#ff2e97" stroke-width="5"/>
  <circle class="tip" cx="256" cy="108" r="10" fill="#00e5ff"/>

  <!-- body: one capsule -->
  <rect x="166" y="150" width="180" height="242" rx="70" fill="#141a2e" stroke="#ff2e97" stroke-width="6"/>

  <!-- eyes -->
  <g class="eye">
    <ellipse cx="222" cy="208" rx="11" ry="12" fill="#00e5ff"/>
    <ellipse cx="290" cy="208" rx="11" ry="12" fill="#00e5ff"/>
    <g class="pupils">
      <circle cx="222" cy="208" r="4" fill="#0b0e1a"/>
      <circle cx="290" cy="208" r="4" fill="#0b0e1a"/>
    </g>
  </g>

  <!-- belly gauge -->
  <rect x="196" y="330" width="120" height="18" rx="9" fill="#0b0e1a" stroke="#8a98c4" stroke-opacity=".43" stroke-width="2"/>
  <rect class="gauge" x="200" y="334" width="12" height="10" rx="5" fill="#39ff14"/>

  <text x="256" y="466" font-family="Menlo, monospace" font-size="40" font-weight="bold"
        text-anchor="middle" fill="#ff2e97">aimon</text>
</svg>
